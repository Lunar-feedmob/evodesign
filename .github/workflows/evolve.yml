name: Run EvoDesign evolution

on:
  schedule:
    # 16:00 UTC is 09:00 America/Los_Angeles during daylight saving time.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evodesign-daily-evolution
  cancel-in-progress: false

jobs:
  evolve:
    name: Create the next verified generation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVODESIGN_CODEX_MODEL: gpt-5.5
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the latest Codex CLI
        run: npm install --global @openai/codex@latest

      - name: Verify evolution credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CODEX_ACCESS_TOKEN:-}" && -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::Set CODEX_ACCESS_TOKEN or OPENAI_API_KEY before running EvoDesign evolution."
            exit 1
          fi
          codex --version

      - name: Configure Git commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run preflight
        shell: bash
        run: bash scripts/evolve.sh --preflight

      - name: Run one evolution cycle
        shell: bash
        run: bash scripts/evolve.sh
